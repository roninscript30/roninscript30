<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marudhu // @roninscript30</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #040711;
      color: #f8fafc;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .terminal-container {
      width: 100%;
      max-width: 680px;
      background-color: #080d1a;
      border: 1px solid #162238;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      line-height: 0;
    }

    .brick-row {
      width: 100%;
      display: block;
      line-height: 0;
      margin: 0;
      padding: 0;
    }

    .brick-row img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
      border: none;
    }

    .clickable-player {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <!-- Brick 1: Header -->
    <div class="brick-row">
      <img src="assets/header.svg" alt="Header" />
    </div>

    <!-- Brick 2: Solar System -->
    <div class="brick-row">
      <img src="assets/solar-system.svg" alt="Celestial Solar System" />
    </div>

    <!-- Brick 3: Whoami -->
    <div class="brick-row">
      <img src="assets/whoami.svg" alt="Whoami" />
    </div>

    <!-- Brick 4: Quests & Exploration Log -->
    <div class="brick-row">
      <img src="assets/quests-and-log.svg" alt="Quests and Log" />
    </div>

    <!-- Brick 5: Interests -->
    <div class="brick-row">
      <img src="assets/interests.svg" alt="Interests" />
    </div>

    <!-- Brick 6: Now Playing Music Player -->
    <div class="brick-row clickable-player" id="playerBrick" onclick="toggleAudio()" title="Click to play / pause lofi beats">
      <img src="assets/now-playing.svg" alt="Now Playing" />
    </div>

    <!-- Brick 7: Footer -->
    <div class="brick-row">
      <img src="assets/footer.svg" alt="Footer" />
    </div>
  </div>

  <script>
    // Live Web Audio Lofi Synth Engine for interactive sound playback
    let audioCtx = null;
    let isPlaying = false;
    let synthTimer = null;

    const chords = [
      [261.63, 329.63, 392.00, 493.88], // Cmaj7
      [220.00, 261.63, 329.63, 392.00], // Am7
      [174.61, 220.00, 261.63, 329.63], // Fmaj7
      [196.00, 246.94, 293.66, 349.23]  // G7
    ];
    let chordIdx = 0;

    function playLofiChord() {
      if (!audioCtx || !isPlaying) return;
      const now = audioCtx.currentTime;
      const chord = chords[chordIdx];
      chordIdx = (chordIdx + 1) % chords.length;

      chord.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.05);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.04, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 3.0);
      });
    }

    function toggleAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      isPlaying = !isPlaying;
      if (isPlaying) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        synthTimer = setInterval(playLofiChord, 3000);
        playLofiChord();
      } else {
        clearInterval(synthTimer);
      }
    }
  </script>
</body>
</html>
